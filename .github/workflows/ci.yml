name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: git config --global user.email ci@example.invalid && git config --global user.name CI
        shell: bash
      - run: python -m unittest discover -s tests -v

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The installers fetch the panel from GitHub at this commit.
      CORRAL_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Panel tests
        run: node --test desktop/tests/panel.test.mjs
      - name: install.sh, into a Herdr home showing its own main layout
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export HERDR_APP_HOME="$RUNNER_TEMP/herdr-app"
          mkdir -p "$HERDR_APP_HOME/layouts" && echo '{}' > "$HERDR_APP_HOME/layouts/main.json"
          sh desktop/install.sh | tee out.txt
          head -n 1 "$HERDR_APP_HOME/mods/corral/main.js" | grep -q '^// Corral panel'
          grep -q 'herdr-app do layout.clone --name main --as main-corral' out.txt
      - name: install.ps1 parses (Windows PowerShell and PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($exe in "powershell", "pwsh") {
            & $exe -NoProfile -Command '$e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile("desktop\install.ps1", [ref]$null, [ref]$e); if ($e) { $e; exit 1 }'
            if ($LASTEXITCODE) { exit 1 }
          }
      - name: install.ps1, into a Herdr home showing its own main layout
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:HERDR_APP_HOME = Join-Path $env:RUNNER_TEMP "herdr-app"
          New-Item -ItemType Directory -Force -Path "$env:HERDR_APP_HOME\layouts" | Out-Null
          Set-Content -Path "$env:HERDR_APP_HOME\layouts\main.json" -Value "{}"
          # A herdr-app with no window open: complains on stderr and exits 1.
          $stub = Join-Path $env:RUNNER_TEMP "stub"
          New-Item -ItemType Directory -Force -Path $stub | Out-Null
          Set-Content -Path "$stub\herdr-app.cmd" -Value "@echo no Herdr window 1>&2`r`n@exit /b 1"
          $env:PATH = "$stub;$env:PATH"
          Get-Content desktop\install.ps1 -Raw | Invoke-Expression *>&1 | Tee-Object -Variable out
          if (-not ((Get-Content "$env:HERDR_APP_HOME\mods\corral\main.js" -TotalCount 1) -like "// Corral panel*")) { throw "main.js wasn't installed" }
          if (-not ($out -match "herdr-app do layout.clone --name main --as main-corral")) { throw "no layout.clone instruction" }
          # The stub's exit code is still in $LASTEXITCODE, which the runner would report.
          exit 0
