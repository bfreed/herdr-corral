id = "corral"
name = "Corral"
version = "0.15.3"
min_herdr_version = "0.8.0"
description = "Herd your Git worktrees: env files, dependencies, agent/shell/server tabs, and merge-safe cleanup"
platforms = ["linux", "macos"]

[[events]]
on = "worktree.created"
command = ["python3", "hwt.py", "event"]

[[events]]
on = "worktree.opened"
command = ["python3", "hwt.py", "event"]

[[events]]
on = "worktree.removed"
command = ["python3", "hwt.py", "event"]

[[actions]]
id = "status"
title = "Worktree status"
contexts = ["workspace"]
command = ["python3", "hwt.py", "status"]

[[actions]]
id = "cleanup"
title = "Corral: clean up this worktree (merge-checked)"
contexts = ["workspace"]
command = ["python3", "hwt.py", "cleanup-workspace"]

[[actions]]
id = "palette"
title = "Corral: worktree palette"
contexts = ["workspace"]
command = ["python3", "hwt.py", "palette-open"]

[[panes]]
id = "palette"
title = "Corral"
placement = "popup"
width = "70%"
height = "70%"
command = ["python3", "hwt.py", "palette"]
